<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habbit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta id="meta-theme-color" name="theme-color" content="#F6F5F2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Habbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        if (typeof navigator !== 'undefined' && (navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches))) {
          document.documentElement.style.setProperty('--app-height', '100vh');
        }
      } catch (e) {}
      try {
        var savedTheme = null;
        try {
          savedTheme = window.localStorage && window.localStorage.getItem('habbit.theme');
        } catch (err) {}
        var normalizedTheme = (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system') ? savedTheme : 'system';
        var systemDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var resolvedTheme = (normalizedTheme === 'dark' || (normalizedTheme === 'system' && systemDark)) ? 'dark' : 'light';
        var rootEl = document.documentElement;
        if (resolvedTheme === 'dark') {
          rootEl.classList.add('dark');
        } else {
          rootEl.classList.remove('dark');
        }
        rootEl.setAttribute('data-theme', resolvedTheme);
        rootEl.style.colorScheme = resolvedTheme;
        var themeMeta = document.getElementById('meta-theme-color');
        if (themeMeta) {
          themeMeta.setAttribute('content', resolvedTheme === 'dark' ? '#161514' : '#F6F5F2');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F6F5F2] text-[#1C1B18] dark:bg-[#161514] dark:text-[#F4F1EA] antialiased selection:bg-[#C86D51]/20 selection:text-[#C86D51]">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
